# ==========================================================================
# nginx — Glide 2000 : site statique + API sur le meme domaine
# A placer dans /etc/nginx/sites-available/glide2000 puis :
#   ln -s /etc/nginx/sites-available/glide2000 /etc/nginx/sites-enabled/
#   certbot --nginx -d <domaine>
# ==========================================================================

server {
    listen 80;
    server_name <domaine>;

    root /var/www/glide2000;
    index index.html;

    # API -> backend Node (mêmes chemins que l'API Airtable)
    location /v0/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 10m;
    }

    # Interdit l'acces aux fichiers caches (.env, .git...)
    location ~ /\. {
        deny all;
    }

    # Site statique — pas de cache sur le HTML pour que les deploys soient visibles
    location / {
        try_files $uri $uri/ =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
